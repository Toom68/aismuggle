[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aismuggle"
version = "0.1.0"
description = "Disguise OpenAI chat traffic as web searches"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
aismuggle = "aismuggle:main"

[tool.setuptools]
py-modules = ["aismuggle", "client", "crypto", "server"]

[tool.setuptools.package-data]
"*" = ["static/*"]
